<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>טוביה אוכל את הארץ · ההליכה</title>
<meta name="description" content="משחק מעריצים על טוביה טננבום: הולכים, פוגשים, אוכלים, רושמים. אב-טיפוס walker.">
<meta name="theme-color" content="#2B1D14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&family=Gveret+Levin+AlefAlefAlef&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='18' cy='32' r='12' fill='none' stroke='%23C0262D' stroke-width='6'/%3E%3Ccircle cx='46' cy='32' r='12' fill='none' stroke='%23C0262D' stroke-width='6'/%3E%3Cpath d='M30 30q2-4 4 0' stroke='%23C0262D' stroke-width='4' fill='none'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">

  <!-- ============ TITLE ============ -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <div class="title-art" id="title-art" aria-hidden="true"></div>
      <div class="title-text">
        <p class="kicker" id="title-sub"></p>
        <h1 id="title-h1"></h1>
        <p class="quip" id="title-quip"></p>
        <div class="title-buttons">
          <button class="btn big primary" id="btn-start"></button>
          <button class="btn big" id="btn-resume" hidden></button>
          <div class="row">
            <button class="btn" id="btn-endings"></button>
            <button class="btn" id="btn-settings"></button>
          </div>
        </div>
        <div class="gallery" id="gallery"></div>
        <p class="controls-hint" id="controls-hint"></p>
        <a class="back-link" href="../" id="back-link"></a>
      </div>
    </div>
    <div class="title-goat" id="title-goat" title="העז"></div>
  </section>

  <!-- ============ CHAPTER CARD ============ -->
  <section id="screen-card" class="screen">
    <div class="card-inner">
      <p class="card-n" id="card-n"></p>
      <h2 class="card-title" id="card-title"></h2>
      <p class="card-sub" id="card-sub"></p>
      <div class="card-shot" id="card-shot"></div>
      <p class="card-aside" id="card-aside"></p>
      <button class="btn big primary" id="card-go">להתחיל ללכת</button>
    </div>
  </section>

  <!-- ============ PLAY ============ -->
  <section id="screen-play" class="screen">
    <div id="hud">
      <div class="hud-face" id="hud-face" title="מצב רוח">
        <div class="face" id="hud-face-svg"></div>
        <div class="mood"><div class="mood-bar"><div class="mood-fill" id="mood-fill"></div></div><div class="mood-label" id="mood-label"></div></div>
      </div>
      <div class="hud-mid">
        <div class="hud-pages" id="hud-pages" title="עמודים לספר">📖 <b id="pages-n">0</b></div>
        <div class="hud-ing" id="hud-ing" title="רמזים לצ'ולנט המושלם"></div>
        <div class="hud-check" id="hud-check"></div>
      </div>
      <div class="hud-btns">
        <button class="hbtn" id="btn-disguise" title="תחפושת (Q)">🎭</button>
        <button class="hbtn" id="btn-notebook" title="פנקס (N)">📓</button>
        <button class="hbtn" id="btn-phone" title="איזי (P)">📱</button>
        <button class="hbtn" id="btn-cola" title="קולה זירו חירום">🥤<i id="cola-n">0</i></button>
        <button class="hbtn" id="btn-rug" title="רוגעלך">🥐<i id="rug-n">0</i></button>
        <button class="hbtn" id="btn-gear" title="הגדרות">⚙️</button>
      </div>
    </div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="aside" class="aside" hidden></div>
      <div id="toasts"></div>
      <div id="prompt" class="prompt" hidden></div>
      <div id="rush" class="rush" hidden></div>
      <div id="disguise-tag" class="disguise-tag"></div>
      <div id="joystick" class="joystick"><div class="knob"></div></div>
      <button id="btn-action" class="action">💬</button>
    </div>
  </section>

  <!-- ============ TAXI ============ -->
  <section id="screen-taxi" class="screen">
    <div class="taxi-scene">
      <div class="road"></div>
      <div class="taxi-art" id="taxi-art"></div>
      <div class="meter" id="taxi-meter">המונה: <bdi>200 ₪</bdi></div>
    </div>
  </section>

  <!-- ============ WORLD MAP ============ -->
  <section id="screen-world" class="screen">
    <div class="world-wrap">
      <h2 id="world-title"></h2>
      <p class="world-hint" id="world-hint"></p>
      <div class="world-map" id="world-map"></div>
      <p class="world-line" id="world-line"></p>
      <button class="btn" id="world-notebook">📓 פנקס</button>
    </div>
  </section>

  <!-- ============ ENDING ============ -->
  <section id="screen-ending" class="screen">
    <div class="ending-wrap">
      <p class="kicker" id="ending-kicker">סוף</p>
      <h2 id="ending-title"></h2>
      <div class="ending-art" id="ending-art"></div>
      <div class="book" id="ending-book"></div>
      <p class="ending-cond" id="ending-cond"></p>
      <div class="row" id="ending-buttons" hidden>
        <button class="btn big primary" id="ending-title-btn">לתפריט</button>
        <button class="btn big" id="ending-again">עוד פעם. בשביל הקוגל.</button>
      </div>
    </div>
    <div class="vignette"></div>
  </section>

  <!-- ============ DIALOGUE (global) ============ -->
  <div id="dlg" class="dlg" hidden>
    <div class="dlg-portrait" id="dlg-portrait"></div>
    <div class="dlg-body">
      <div class="dlg-name" id="dlg-name"></div>
      <div class="dlg-text" id="dlg-text"></div>
      <div class="dlg-choices" id="dlg-choices" hidden></div>
      <div class="dlg-hint" id="dlg-hint">▼</div>
    </div>
  </div>

  <!-- ============ MODALS ============ -->
  <div id="modal-notebook" class="modal" hidden>
    <div class="modal-box notebook">
      <div class="modal-head"><h3 id="nb-title"></h3><button class="btn small" data-close>✕</button></div>
      <div class="nb-stats" id="nb-stats"></div>
      <div class="nb-pages" id="nb-pages"></div>
    </div>
  </div>

  <div id="modal-phone" class="modal" hidden>
    <div class="phone">
      <div class="phone-top"><span>📱 איזי</span><span id="phone-time">ניו יורק · <bdi>3:12</bdi></span></div>
      <div class="phone-chat" id="phone-chat"></div>
      <button class="btn primary" id="phone-next">המשך</button>
    </div>
  </div>

  <div id="modal-settings" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3>הגדרות</h3><button class="btn small" data-close>✕</button></div>
      <div class="settings" id="settings-body"></div>
    </div>
  </div>

  <div id="modal-endings" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3>סיומים</h3><button class="btn small" data-close>✕</button></div>
      <div class="endings-grid" id="endings-grid"></div>
    </div>
  </div>

  <div id="modal-disguise" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3>🎭 תחפושת</h3><button class="btn small" data-close>✕</button></div>
      <div class="disguise-grid" id="disguise-grid"></div>
    </div>
  </div>

  <div id="modal-confirm" class="modal" hidden>
    <div class="modal-box confirm">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text"></p>
      <div class="row"><button class="btn primary" id="confirm-yes"></button><button class="btn" id="confirm-no"></button></div>
    </div>
  </div>

</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
